<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c2c">
  <title>Pacific Time · Question 2 Correction</title>
  <meta name="description" content="Live Pacific Time and the Question 2 correction: εox = 3.45 × 10⁻¹³ F/cm. A large, two-panel classroom display.">
  <link rel="canonical" href="https://yokiyuzi.github.io/display/">
  <link rel="stylesheet" href="/display/style.css">
  <script src="/display/clock.js" defer></script>
</head>
<body>
  <main class="display">
    <section class="clock-panel" aria-labelledby="clock-heading">
      <div class="top-bar">
        <a class="home-link" href="/" aria-label="Back to home">↖ Home</a>
        <button id="fullscreen" type="button" hidden>Fullscreen ⛶</button>
      </div>
      <div class="clock-content">
        <h1 id="clock-heading">Pacific Time <span class="zone" id="zone">PT</span></h1>
        <time class="clock" id="clock" aria-label="Live Pacific Time">--:--:--</time>
        <p class="date" id="date">Los Angeles, United States</p>
        <noscript><p class="clock-note">Enable JavaScript to display the live clock.</p></noscript>
      </div>
      <p class="clock-note">PACIFIC TIME · LOS ANGELES · 24-HOUR CLOCK</p>
    </section>

    <section class="notice-panel" aria-labelledby="notice-heading">
      <h2 id="notice-heading">Question <span class="question-number">02</span><span class="notice-label">Correction</span></h2>
      <p class="parameter-name">Oxide permittivity · Epsilon ox</p>
      <div class="parameter" role="math" aria-label="Epsilon ox equals 3.45 times 10 to the power of minus 13 farads per centimeter">
        <span class="symbol">ε<sub>ox</sub></span>
        <span class="equals">=</span>
        <span class="value">3.45 <span class="multiply">×</span> 10<sup>−13</sup></span>
        <span class="unit">F/cm</span>
      </div>
      <div class="context" role="math" aria-label="C ox equals epsilon ox divided by t ox; t ox equals 100 times 10 to the power of minus 8 centimeters">
        <span><i>C</i><sub>ox</sub> = <span class="fraction"><span>ε<sub>ox</sub></span><span><i>t</i><sub>ox</sub></span></span></span>
        <span class="context-divider" aria-hidden="true"></span>
        <span><i>t</i><sub>ox</sub> = 100 × 10<sup>−8</sup> cm</span>
      </div>
    </section>
  </main>
</body>
</html>
