name: Build and deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-livephotos.txt
      - name: Install media converters
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r tools/requirements-livephotos.txt
      - name: Test Live Photo conversion
        run: python -m unittest discover -s tests -v
      - name: Build site and convert uploaded LIVP files
        run: python tools/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages publishing source
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: pages} = await github.rest.repos.getPages(repo);
            if (pages.build_type !== 'workflow') {
              core.setFailed('Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow.');
            }
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
